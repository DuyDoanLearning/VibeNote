<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: https: http:; font-src 'self' data:">
  <title>VibeNote</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="titlebar"></div>
      <div class="brand"><span class="logo">✦</span> VibeNote</div>
      <nav>
        <button class="nav-item" data-filter="all">
          <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
          <span class="label">All Notes</span><span class="count" id="count-all"></span>
        </button>
        <button class="nav-item" data-filter="inbox" data-drop="">
          <svg viewBox="0 0 24 24"><path d="M3 13h5l2 3h4l2-3h5M5 5h14l2 8v6H3v-6z"/></svg>
          <span class="label">Inbox</span><span class="count" id="count-inbox"></span>
        </button>
      </nav>
      <div class="section-head">
        <span>Notebooks</span>
        <button id="add-notebook" class="mini" title="New notebook (⇧⌘N)">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div id="notebooks"></div>
      <div class="sidebar-foot">
        <button id="folder-btn" title="Change notes folder">
          <svg viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/></svg>
          <span id="folder-name"></span>
        </button>
      </div>
    </aside>

    <section id="list">
      <div class="titlebar list-head">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
          <input id="search" type="search" placeholder="Search notes" spellcheck="false">
        </div>
        <button id="new-note" class="icon" title="New note (⌘N)">
          <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
        </button>
      </div>
      <div id="list-title"></div>
      <ul id="notes"></ul>
    </section>

    <main id="main">
      <div class="titlebar toolbar">
        <label class="nb-pick" title="Move to notebook">
          <svg viewBox="0 0 24 24"><path d="M5 4h12a2 2 0 012 2v14H7a2 2 0 01-2-2zM5 18a2 2 0 012-2h12"/></svg>
          <select id="nb-select"></select>
        </label>
        <div class="spacer"></div>
        <div class="seg" id="modes">
          <button data-mode="edit" title="Editor only (⌘1)">Edit</button>
          <button data-mode="split" title="Split (⌘2)">Split</button>
          <button data-mode="preview" title="Preview only (⌘3)">Preview</button>
        </div>
        <button id="reveal-btn" class="icon" title="Reveal in Finder (⇧⌘R)">
          <svg viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/></svg>
        </button>
        <button id="trash-btn" class="icon" title="Move to Trash">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        </button>
      </div>
      <div id="panes" class="split">
        <div id="editor"></div>
        <article id="preview" class="markdown"></article>
      </div>
      <div id="empty">
        <div class="empty-mark">✦</div>
        <p>No note selected</p>
        <button id="empty-new">New note <kbd>⌘N</kbd></button>
      </div>
      <footer id="status"></footer>
    </main>
  </div>
  <div id="toast"></div>
  <script src="dist/renderer.js"></script>
</body>
</html>
