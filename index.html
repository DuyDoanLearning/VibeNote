<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: https: http:; font-src 'self' data:">
  <title>VibeNote</title>
  <link rel="stylesheet" href="dist/katex/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="markdown.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="titlebar"></div>
      <div class="brand"><span class="logo">✦</span> VibeNote</div>
      <div class="side-scroll">
        <nav id="library"></nav>
        <div class="section-head">
          <span>Notebooks</span>
          <button id="add-notebook" class="mini" title="New notebook (⇧⌘N)">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div id="notebooks"></div>
        <div class="section-head"><span>Status</span></div>
        <div id="statuses"></div>
        <div class="section-head"><span>Tags</span></div>
        <div id="tags"></div>
      </div>
      <div class="sidebar-foot">
        <div id="trash-nav"></div>
        <button id="folder-btn" class="foot-btn" title="Change notes folder">
          <svg viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/></svg>
          <span id="folder-name"></span>
        </button>
      </div>
    </aside>

    <section id="list">
      <div class="titlebar list-head">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
          <input id="search" type="search" placeholder="Search  (tag:  book:  status:)" spellcheck="false">
        </div>
        <button id="new-note" class="icon" title="New note (⌘N)">
          <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
        </button>
      </div>
      <div class="list-title-row">
        <span id="list-title"></span>
        <button id="sort-btn" class="mini" title="Sort notes">
          <svg viewBox="0 0 24 24"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>
        </button>
      </div>
      <ul id="notes"></ul>
    </section>

    <main id="main">
      <div class="titlebar toolbar">
        <div id="note-tools" class="tools">
          <button id="back-btn" class="icon nav" title="Back (⌃-)">
            <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <button id="fwd-btn" class="icon nav" title="Forward (⌃⇧-)">
            <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </button>
          <label class="nb-pick" title="Notebook">
            <svg viewBox="0 0 24 24"><path d="M5 4h12a2 2 0 012 2v14H7a2 2 0 01-2-2zM5 18a2 2 0 012-2h12"/></svg>
            <select id="nb-select"></select>
          </label>
          <div class="spacer"></div>
          <button id="pin-btn" class="icon" title="Pin note (⌥⌘P)">
            <svg viewBox="0 0 24 24"><path d="M9 4h6l-1 6 4 3v2H6v-2l4-3zM12 15v6"/></svg>
          </button>
          <div class="seg" id="modes">
            <button data-mode="edit" title="Editor only (⌘1)">Edit</button>
            <button data-mode="split" title="Split (⌘2)">Split</button>
            <button data-mode="preview" title="Preview only (⌘3)">Preview</button>
          </div>
          <button id="more-btn" class="icon" title="More">
            <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
          </button>
        </div>
        <div id="trash-tools" class="tools">
          <span class="trash-note">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
            This note is in the Trash
          </span>
          <div class="spacer"></div>
          <button id="restore-btn" class="btn primary">Restore</button>
          <button id="delete-btn" class="btn danger">Delete forever</button>
        </div>
      </div>
      <div id="metabar">
        <label class="status-pick" id="status-pick">
          <span class="dot"></span>
          <select id="status-select">
            <option value="">No status</option>
            <option value="active">Active</option>
            <option value="onhold">On hold</option>
            <option value="completed">Completed</option>
            <option value="dropped">Dropped</option>
          </select>
        </label>
        <div id="tag-list"></div>
        <input id="tag-input" list="tag-options" placeholder="+ Add tag" spellcheck="false">
        <datalist id="tag-options"></datalist>
      </div>
      <div id="panes" class="split">
        <div id="editor"></div>
        <article id="preview" class="markdown"></article>
      </div>
      <div id="empty">
        <div class="empty-mark">✦</div>
        <p>No note selected</p>
        <button id="empty-new" class="btn primary">New note <kbd>⌘N</kbd></button>
        <p class="empty-hint">or press <kbd>⌘K</kbd> to jump anywhere</p>
      </div>
      <footer id="status"><span id="status-words"></span><span id="status-save"></span></footer>
    </main>
  </div>
  <div id="overlay" hidden></div>
  <div id="toast"></div>
  <script src="dist/renderer.js"></script>
</body>
</html>
